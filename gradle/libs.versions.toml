[versions]
agp = "8.13.2"
material = "1.14.0"
appcompat = "1.8.0"
cardview = "1.0.0"
recyclerview = "1.4.0"
coordinatorlayout = "1.3.0"
viewpager = "1.1.0"
work = "2.12.0"
documentfile = "1.1.0"
expandableTextView = "0.1.4"
glide = "5.0.9"
junit = "4.13.2"
preference = "1.2.1"
dragListView = "1.7.3"
fastScroll = "2.0.1"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "cardview" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-coordinatorlayout = { module = "androidx.coordinatorlayout:coordinatorlayout", version.ref = "coordinatorlayout" }
androidx-viewpager = { module = "androidx.viewpager:viewpager", version.ref = "viewpager" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "preference" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
# https://github.com/Manabu-GT/ExpandableTextView
expandable-textview = { module = "com.ms-square:expandableTextView", version.ref = "expandableTextView" }
# https://github.com/bumptech/glide
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
# https://github.com/woxblom/DragListView
draglistview = { module = "com.github.woxthebox:draglistview", version.ref = "dragListView" }
# https://github.com/timusus/RecyclerView-FastScroll
recyclerview-fastscroll = { module = "com.simplecityapps:recyclerview-fastscroll", version.ref = "fastScroll" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
