org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
signingProperties=../pocket-amc-reader-resources/keystores/keystore.properties
android.useAndroidX=true
# Legacy compatibility flags needed by the current code base (remove once migrated):
# - Jetifier: some old libraries (e.g. ExpandableTextView) may still reference support-library classes.
#   Run `gradle checkJetifier` to find out; remove the flag when nothing needs it.
android.enableJetifier=true
# - Code uses switch(...) { case R.id.x }, which needs final resource IDs.
android.nonFinalResIds=false
# - Code reads library resources through the app's R class (e.g. R.attr.fontPath from Calligraphy).
android.nonTransitiveRClass=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
org.gradle.configuration-cache=true
