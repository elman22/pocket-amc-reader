pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Some libraries are published only on JitPack
        maven {
            url 'https://jitpack.io'
            content { includeGroupByRegex 'com\\.github\\..*' }
        }
        // jcenter() is sunset (read-only). Uncomment ONLY if a legacy artifact fails to resolve:
        // jcenter()
    }
}

rootProject.name = 'PocketAMCReader'
include ':PocketAMCReader'
