plugins {
    alias(libs.plugins.android.application)
}

def appVersionName = '3.0.0'

// Archive name, e.g. PocketAMCReader-2.3.4-release.apk
base {
    archivesName = "PocketAMCReader-${appVersionName}"
}

android {
    namespace 'com.holdingscythe.pocketamcreader'
    compileSdk 37

    defaultConfig {
        applicationId "com.holdingscythe.pocketamcreader"
        minSdk 24
        targetSdk((project.findProperty('amc.targetSdk') ?: 37) as int)
        versionCode 109
        versionName appVersionName
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "int", "LOGLEVEL", "6"
        }
        debug {
            minifyEnabled false
            buildConfigField "int", "LOGLEVEL", "2"
        }
    }

    lint {
        abortOnError false
    }

    testOptions {
        unitTests {
            // android.jar methods (Log, Uri...) used by tested code return defaults instead of throwing
            returnDefaultValues = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

if (project.hasProperty("signingProperties") && new File(project.property("signingProperties")).exists()) {

    Properties keystoreProperties = new Properties()
    keystoreProperties.load(new FileInputStream(rootProject.file(project.property("signingProperties"))))

    android {
        signingConfigs {
            production {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
        buildTypes {
            release {
                versionNameSuffix '.signed'
                signingConfig signingConfigs.production
            }
        }
    }
}

dependencies {
    implementation libs.material
    implementation libs.androidx.appcompat
    implementation libs.androidx.cardview
    implementation libs.androidx.recyclerview
    implementation libs.androidx.coordinatorlayout
    implementation libs.androidx.viewpager
    implementation libs.androidx.work.runtime
    implementation libs.androidx.documentfile
    implementation libs.androidx.preference
    implementation libs.glide
    implementation libs.draglistview
    implementation libs.recyclerview.fastscroll

    testImplementation libs.junit
}
