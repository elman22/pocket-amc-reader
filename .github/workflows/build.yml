name: Build

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Uses the committed Gradle wrapper (gradlew, gradlew.bat, gradle/wrapper/gradle-wrapper.jar).
      # The `gradle-version` is only a fallback for a repository without the wrapper.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'
      - name: Unit tests, debug APK and lint
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :PocketAMCReader:testDebugUnitTest :PocketAMCReader:assembleDebug :PocketAMCReader:lintDebug
          else
            gradle :PocketAMCReader:testDebugUnitTest :PocketAMCReader:assembleDebug :PocketAMCReader:lintDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: PocketAMCReader/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: PocketAMCReader/build/reports/tests/
